version: '3.8'

services:
  evolution-api:
    image: atendimento/evolution-api:latest
    container_name: evolution-api
    restart: always
    ports:
      - "8080:8080"
    environment:
      - SERVER_URL=http://localhost:8080
      - DOCKER_ENABLE=true
      - DATABASE_ENABLED=true
      - DATABASE_PROVIDE=sqlite
      - DATABASE_SAVE_DATA_INSTANCE=true
      - DATABASE_URL=/evolution/database
      - DEL_INSTANCE=false
      - LOG_LEVEL=info
      - LOG_FILE=logs.log
      - LOG_COLOR=true
      - QRCODE_LIMIT=30
      - AUTHENTICATION_API_KEY=123456789
      - AUTHENTICATION_EXPOSE_IN_FETCH_INSTANCES=true
    volumes:
      - evolution_instances:/evolution/instances
      - evolution_store:/evolution/store
      - evolution_database:/evolution/database
      - evolution_logs:/evolution/logs

volumes:
  evolution_instances:
  evolution_store:
  evolution_database:
  evolution_logs:
