<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>لا يوجد اتصال - مدرسة صفوة الرواد الأهلية</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #1a237e;
      color: #fff;
      font-family: 'Segoe UI', Tahoma, Arial, sans-serif;
      text-align: center;
      padding: 24px;
    }
    .box { max-width: 420px; }
    .icon { font-size: 72px; margin-bottom: 16px; }
    h1 { font-size: 26px; margin: 0 0 12px; }
    p { color: #c5cae9; line-height: 1.8; margin: 0 0 28px; }
    button {
      background: #ffd54f;
      color: #1a237e;
      border: none;
      border-radius: 10px;
      padding: 13px 36px;
      font-size: 17px;
      font-weight: bold;
      cursor: pointer;
    }
    button:hover { background: #ffca28; }
  </style>
</head>
<body>
  <div class="box">
    <div class="icon">📡</div>
    <h1>لا يوجد اتصال بالإنترنت</h1>
    <p>تعذر تحميل الصفحة. تأكد من اتصالك بالشبكة ثم أعد المحاولة.</p>
    <button onclick="window.location.reload()">إعادة المحاولة</button>
  </div>
</body>
</html>
